name: Full Deployment (Infra + Backend + Frontend)

on:
  push:
    branches:
      - workflow
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_HOST: sajaregistry.azurecr.io
  RESOURCE_GROUP: saja-rg-1
  BACKEND_APP: backend-app
  FRONTEND_APP: frontend-app
  LOCATION: centralindia

jobs:
  # ======================================================
  # 1️⃣ INFRASTRUCTURE DEPLOYMENT (TERRAFORM)
  # ======================================================
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Plan
        run: cd terraform && terraform plan -out=tfplan

      - name: Terraform Apply
        run: cd terraform && terraform apply -auto-approve tfplan

  # ======================================================
  # 2️⃣ BACKEND DEPLOYMENT (JAVA + DOCKER + ACR)
  # ======================================================
  backend:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR_HOST -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build backend image
        run: |
          cd backend
          mvn clean package -DskipTests
          docker build -t $ACR_HOST/backend:latest .

      - name: Push backend image
        run: docker push $ACR_HOST/backend:latest

      - name: Deploy backend container app
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_HOST/backend:latest

  # ======================================================
  # 3️⃣ FRONTEND DEPLOYMENT (REACT + VITE + DOCKER)
  # ======================================================
  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR_HOST -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build frontend app
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build frontend image
        run: |
          cd frontend
          docker build -t $ACR_HOST/frontend:latest .

      - name: Push frontend image
        run: docker push $ACR_HOST/frontend:latest

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_HOST/frontend:latest
