name: Full Deployment (Infra + Backend + Frontend)

on:
  push:
    branches:
      - workflow
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_HOST: sajaregistry.azurecr.io
  RESOURCE_GROUP: saja-rg-1
  BACKEND_APP: backend-app
  FRONTEND_APP: frontend-app
  LOCATION: centralindia
  TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}

jobs:
  # ======================================================
  # 1️⃣ INFRASTRUCTURE DEPLOYMENT (TERRAFORM)
  # ======================================================
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock=false -out terraform.tfplan
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve=true -lock-timeout=30s -input=false terraform.tfplan
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

  # ======================================================
  # 2️⃣ BACKEND DEPLOYMENT (JAVA + DOCKER + ACR)
  # ======================================================
  backend:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sajaregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          cd backend
          mvn clean package -DskipTests
          docker build -t $ACR_HOST/backend:latest .

      - name: Push backend image
        run: docker push $ACR_HOST/backend:latest

      - name: Deploy backend container app
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_HOST/backend:latest

  # ======================================================
  # 3️⃣ FRONTEND DEPLOYMENT (REACT + VITE + DOCKER)
  # ======================================================
  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sajaregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD}}

      - name: Build frontend app
        run: |
          cd frontend
          npm ci
           echo "VITE_API_BASE_URL=http://74.225.172.165" > .env
          cat .env
          npm run build

      - name: Build frontend image
        run: |
          cd frontend
          docker build -t $ACR_HOST/frontend:latest .

      - name: Push frontend image
        run: docker push $ACR_HOST/frontend:latest

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_HOST/frontend:latest
