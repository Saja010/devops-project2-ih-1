permissions:
  id-token: write
  contents: read

name: Full Deployment (Infra + Backend + Frontend)

on:
  push:
    branches:
      - ci-cd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@v4

      # AZURE LOGIN (OIDC)
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Verify Azure CLI Login
        run: az account show

      # DOCKER LOGIN
      - name: Login to ACR
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login sajaregistry.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # BACKEND
      - name: Build & Push Backend
        run: |
          cd backend
          mvn clean package -DskipTests
          docker build -t sajaregistry.azurecr.io/backend:latest .
          docker push sajaregistry.azurecr.io/backend:latest

      # FRONTEND
      - name: Build & Push Frontend
        run: |
          cd frontend
          npm install
          npm run build
          docker build -t sajaregistry.azurecr.io/frontend:latest .
          docker push sajaregistry.azurecr.io/frontend:latest

      # TERRAFORM
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform apply -auto-approve
