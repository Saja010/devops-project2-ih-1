name: CI/CD - Build and Deploy to Azure

on:
  push:
    branches:
      - ci-cd

env:
  REGISTRY_NAME: sajaregistry
  RESOURCE_GROUP: saja-rg-1
  LOCATION: centralindia

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------
      # 🔹 Backend Build & Push
      # ------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_USER }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $REGISTRY_NAME

      - name: Build and Push Backend Docker image
        run: |
          cd backend
          docker build -t $REGISTRY_NAME.azurecr.io/backend:latest .
          docker push $REGISTRY_NAME.azurecr.io/backend:latest

      # ------------------------
      # 🔹 Frontend Build & Push
      # ------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build and Push Frontend Docker image
        run: |
          cd frontend
          docker build -t $REGISTRY_NAME.azurecr.io/frontend:latest .
          docker push $REGISTRY_NAME.azurecr.io/frontend:latest

      # ------------------------
      # 🔹 Terraform Deploy
      # ------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=infra/terraform init

      - name: Terraform Apply
        run: terraform -chdir=infra/terraform apply -auto-approve
