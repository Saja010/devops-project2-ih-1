permissions:
  id-token: write
  contents: read

name: Full Deployment (Infra + Backend + Frontend)

on:
  push:
    branches:
      - ci-cd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ================================
      # CHECKOUT CODE
      # ================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ================================
      # AZURE LOGIN
      # ================================
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ZURE_SUBSCRIPTION_ID }}

      # ================================
      # VERIFY AZ LOGIN
      # ================================
      - name: Verify Azure CLI Login
        run: az account show

      # ================================
      # ACR LOGIN
      # ================================
      - name: Docker login to ACR
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.AZURE_CONTAINER_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # ================================
      # BACKEND BUILD & PUSH
      # ================================
      - name: Build Backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Build and Push Backend Docker image
        run: |
          cd backend
          docker build -t ${{ secrets.ACR_USERNAME }}.azurecr.io/backend:latest .
          docker push ${{ secrets.ACR_USERNAME }}.azurecr.io/backend:latest

      # ================================
      # FRONTEND BUILD & PUSH
      # ================================
      - name: Build Frontend with Node
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build and Push Frontend Docker image
        run: |
          cd frontend
          docker build -t ${{ secrets.ACR_USERNAME }}.azurecr.io/frontend:latest .
          docker push ${{ secrets.ACR_USERNAME }}.azurecr.io/frontend:latest

      # ================================
      # SETUP TERRAFORM
      # ================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform -chdir=infra/terraform init

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform validate

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ZURE_SUBSCRIPTION_ID }}
        run: terraform -chdir=infra/terraform plan

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform -chdir=infra/terraform apply -auto-approve
