permissions:
  contents: read

name: Full Deployment (Build + Push + Terraform) - Run with Secret Token

on:
  workflow_dispatch:

jobs:
  build-push-and-terraform:
    runs-on: ubuntu-latest
    env:
      ACR_HOST: sajaregistry.azurecr.io

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Mask access token
        run: |
          echo "::add-mask::${{ secrets.AZURE_ACCESS_TOKEN }}"

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR_HOST -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build & push backend
        run: |
          cd backend
          mvn clean package -DskipTests
          docker build -t $ACR_HOST/backend:latest .
          docker push $ACR_HOST/backend:latest

      - name: Build & push frontend
        run: |
          cd frontend
          npm ci
          npm run build
          docker build -t $ACR_HOST/frontend:latest .
          docker push $ACR_HOST/frontend:latest

      - name: Azure login using access token
        env:
          AZ_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "$AZ_TOKEN" > /tmp/az_token.txt
          az login --access-token "$(cat /tmp/az_token.txt)" --tenant "$AZ_TENANT"
          az account set --subscription "$AZ_SUBSCRIPTION"
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_acr_password: ${{ secrets.ACR_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan
 
