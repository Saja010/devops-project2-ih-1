# Server Configuration
server.port=8080

# Database Configuration (Azure PostgreSQL)
spring.datasource.url=jdbc:postgresql://saja-postgres-db.postgres.database.azure.com:5432/burgerbuilder
spring.datasource.username=pgadmin
spring.datasource.password=sajaStrong!Passw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize database with schema and data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# CORS Configuration
spring.web.cors.allowed-origins=https://frontend-app.whitepond-c608b356.centralindia.azurecontainerapps.io,http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.burgerbuilder=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
